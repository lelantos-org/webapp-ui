name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # The service URLs `config/env.ts` requires, matching `.env.example` and the
  # values vitest pins. Per-chain values come from registry-webserver's
  # /v1/chains at runtime, so a build no longer needs a chain described to it —
  # which is what the zero-address placeholders here used to fake.
  VITE_REGISTRY_URL: "/registry"
  VITE_RELAYER_URL: "/relayer"
  VITE_FMD_URL: "/fmd"
  # Kept in step with the Dockerfile's defaults so the CI build exercises the
  # same configuration the published image ships with.
  VITE_METAQUOTER_URL: "/metaquoter"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@lelantos-org"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The same gate as a local `npm run verify`: typecheck, Biome, the import
      # rules, knip (unused files, exports and dependencies) and the test suite
      # under its coverage floor.
      - run: npm run verify
      # Prover artifacts ship in the @lelantos-org/circuits package and are
      # resolved through Vite `?url` imports, so `npm ci` is all the build needs.
      - run: npm run build
