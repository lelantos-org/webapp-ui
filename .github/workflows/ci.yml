name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  VITE_CHAIN_ID: "31337"
  VITE_RPC_URL: "http://localhost:8545"
  VITE_MASP_ADDRESS: "0x0000000000000000000000000000000000000000"
  VITE_RELAYER_URL: "/relayer"
  VITE_FMD_URL: "/fmd"
  VITE_RELAYER_ADDRESS: "0x0000000000000000000000000000000000000000"
  VITE_TREE_DEPTH: "10"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@lelantos-org"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check:ci
      - run: npm run typecheck
      - run: npm run test
      # Prover artifacts ship in the @lelantos-org/circuits package and are
      # resolved through Vite `?url` imports, so `npm ci` is all the build needs.
      - run: npm run build
