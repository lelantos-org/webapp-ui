name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # The service URLs `config/env.ts` requires, matching `.env.example` and the
  # values vitest pins. Per-chain values come from protocol-webserver's
  # /v1/chains at runtime.
  VITE_REGISTRY_URL: "/registry"
  VITE_RELAYER_URL: "/relayer"
  VITE_FMD_URL: "/fmd"
  # Matches the Dockerfile's defaults, so CI builds the configuration the
  # published image ships.
  VITE_METAQUOTER_URL: "/metaquoter"

# Together the three jobs are a local `npm run verify` plus the build, run in
# parallel.
jobs:
  # Typecheck, Biome, the import rules, the CSS tokens and knip.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@lelantos-org"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run check:ci
      - run: npm run check:imports
      - run: npm run check:css-tokens
      - run: npm run knip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@lelantos-org"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@lelantos-org"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `vite build`, not `npm run build`: its `tsc -b` repeats the `checks`
      # job's typecheck. Prover artifacts ship in @lelantos-org/circuits and
      # resolve through Vite `?url` imports, so `npm ci` is all the build needs.
      - run: npx vite build
