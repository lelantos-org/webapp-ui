name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # The two the build actually requires. Per-chain values come from the
  # relayer's /chains at runtime, so a build no longer needs a chain described
  # to it — which is what the zero-address placeholders here used to fake.
  VITE_RELAYER_URL: "/relayer"
  VITE_FMD_URL: "/fmd"
  # Kept in step with docker.yml so the CI build exercises the same
  # configuration the published image ships with.
  VITE_METAQUOTER_URL: "/metaquoter"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@lelantos-org"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check:ci
      - run: npm run typecheck
      - run: npm run test
      # Prover artifacts ship in the @lelantos-org/circuits package and are
      # resolved through Vite `?url` imports, so `npm ci` is all the build needs.
      - run: npm run build
