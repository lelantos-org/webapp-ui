name: Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-[a-z]+"

concurrency:
  group: ${{ github.ref }}-docker
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  packages: write
  contents: read
  pull-requests: read

env:
  REGISTRY_URL: ghcr.io
  REPOSITORY: ${{ github.repository }}
  VITE_CHAIN_ID: "31337"
  VITE_RPC_URL: "http://localhost:8545"
  VITE_MASP_ADDRESS: "0x0000000000000000000000000000000000000000"
  VITE_RELAYER_URL: "/relayer"
  VITE_FMD_URL: "/fmd"
  VITE_RELAYER_ADDRESS: "0x0000000000000000000000000000000000000000"
  VITE_TREE_DEPTH: "10"
  VITE_PERMIT2_ADDRESS: ""
  # Blank hides the native-ETH deposit/withdraw option.
  VITE_NATIVE_ADAPTER_ADDRESS: ""
  VITE_EXPLORER_API_URL: "/explorer"
  # Blank leaves the swap tab inert; a real deployment must set both.
  VITE_METAQUOTER_URL: ""
  VITE_SWAP_WRAPPER_ADDRESS: ""

jobs:
  docker:
    name: Docker (webapp-ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_URL }}/${{ env.REPOSITORY }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_CHAIN_ID=${{ env.VITE_CHAIN_ID }}
            VITE_RPC_URL=${{ env.VITE_RPC_URL }}
            VITE_MASP_ADDRESS=${{ env.VITE_MASP_ADDRESS }}
            VITE_RELAYER_URL=${{ env.VITE_RELAYER_URL }}
            VITE_FMD_URL=${{ env.VITE_FMD_URL }}
            VITE_RELAYER_ADDRESS=${{ env.VITE_RELAYER_ADDRESS }}
            VITE_TREE_DEPTH=${{ env.VITE_TREE_DEPTH }}
            VITE_PERMIT2_ADDRESS=${{ env.VITE_PERMIT2_ADDRESS }}
            VITE_NATIVE_ADAPTER_ADDRESS=${{ env.VITE_NATIVE_ADAPTER_ADDRESS }}
            VITE_EXPLORER_API_URL=${{ env.VITE_EXPLORER_API_URL }}
            VITE_METAQUOTER_URL=${{ env.VITE_METAQUOTER_URL }}
            VITE_SWAP_WRAPPER_ADDRESS=${{ env.VITE_SWAP_WRAPPER_ADDRESS }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=webapp-ui
          cache-to: type=gha,scope=webapp-ui,mode=max
