name: Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-[a-z]+"

concurrency:
  group: ${{ github.ref }}-docker
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  packages: write
  contents: read
  pull-requests: read

env:
  REGISTRY_URL: ghcr.io
  REPOSITORY: ${{ github.repository }}
  # Only the shared services are baked in. Every per-chain value now comes
  # from the relayer's /chains at runtime, so the image is deployment-agnostic
  # and these placeholders no longer have to pretend to describe a chain.
  VITE_RELAYER_URL: "/relayer"
  VITE_FMD_URL: "/fmd"
  # Same-origin path, matching the dev proxy in vite.config.ts and the
  # `handle_path /metaquoter/*` route Caddy serves in production.
  #
  # Blank here leaves the swap tab inert: env.ts treats an empty string as
  # absent, and useSwapQuote then throws "VITE_METAQUOTER_URL not configured"
  # when the user requests a quote — at click time, not at boot.
  VITE_METAQUOTER_URL: "/metaquoter"

jobs:
  docker:
    name: Docker (webapp-ui)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_URL }}/${{ env.REPOSITORY }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_RELAYER_URL=${{ env.VITE_RELAYER_URL }}
            VITE_FMD_URL=${{ env.VITE_FMD_URL }}
            VITE_METAQUOTER_URL=${{ env.VITE_METAQUOTER_URL }}
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=webapp-ui
          cache-to: type=gha,scope=webapp-ui,mode=max
