# Included from every `location` block in nginx.conf: `add_header` does not
# inherit into a block that declares a header of its own.

# Cross-origin isolation, required for SharedArrayBuffer and wasm threads:
# wasm-bindgen-rayon (SDK prover worker) gates on `crossOriginIsolated`.
add_header Cross-Origin-Opener-Policy   "same-origin"  always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin"  always;

add_header X-Content-Type-Options "nosniff"     always;
add_header Referrer-Policy        "no-referrer"  always;

# The full CSP is the `<meta http-equiv>` tag in index.html. `frame-ancestors`
# is ignored in meta, so it is set here to block framing the wallet. The meta
# policy is not duplicated: two policies intersect, and drift between them
# silently applies the stricter one.
add_header Content-Security-Policy "frame-ancestors 'none'" always;

add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
