# Included from every `location` block in nginx.conf. nginx's `add_header` does
# not inherit into a block that declares any header of its own, so these must be
# repeated per-block rather than set once at server level.

# Cross-origin isolation — required for SharedArrayBuffer / wasm threads.
# wasm-bindgen-rayon (SDK prover worker) gates on `crossOriginIsolated`.
add_header Cross-Origin-Opener-Policy   "same-origin"  always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin"  always;

add_header X-Content-Type-Options "nosniff"     always;
add_header Referrer-Policy        "no-referrer"  always;

# The full CSP lives in the `<meta http-equiv>` tag in index.html. Only
# `frame-ancestors` is set here, because it is ignored in meta and can only be
# delivered as a response header — and framing a wallet is the attack it stops.
# Deliberately NOT a duplicate of the meta policy: two policies intersect, and
# any drift between them silently applies the stricter one.
add_header Content-Security-Policy "frame-ancestors 'none'" always;

add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
