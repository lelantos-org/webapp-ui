<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300..700&family=Newsreader:opsz,wght@6..72,300..700&family=Public+Sans:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;500;700&display=swap">
  <style>
    :root {
      --bg: #14110E; --bg-1: #1C1815; --bg-2: #241F1A; --bg-3: #2E2822;
      --fg: #F5F1E8; --fg-dim: #BEB5A6; --fg-mute: #9E9486;
      --line: #2A241E; --line-strong: #3A332B;
      --accent: #E0794A; --accent-2: #EA8C60; --accent-dim: #7A4526;
      --warn: #E0A93F; --err: #E67A6E;
      --display: "Newsreader", Georgia, "Times New Roman", serif;
      --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-2); }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums slashed-zero; font-feature-settings: "zero" 1; }
    .shell { min-height: 844px; display: flex; flex-direction: column; background: radial-gradient(420px 300px at 50% -6%, rgba(224,121,74,0.16), transparent 66%), #14110E; }
    .mark { border-radius: 50%; display: inline-grid; place-items: center; font-weight: 700; flex: none; }
    .sub { font-size: 13px; color: var(--fg-mute); }
    .rule { height: 1px; background: var(--line); }
    .cta { display: flex; align-items: center; justify-content: center; gap: 9px; padding: 16px; border-radius: 4px; background: var(--accent); color: #14110E; font-size: 16px; font-weight: 600; min-height: 44px; }
  </style>
</helmet>


<div class="shell">
  <div style="display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line);">
    <svg width="21" height="21" viewBox="0 0 32 32" aria-hidden="true" style="display:block;flex:none;"><circle cx="16" cy="6.5" r="4" fill="var(--accent)"/><circle cx="6.5" cy="25.5" r="4" fill="var(--accent)"/><circle cx="25.5" cy="25.5" r="4" fill="var(--accent)"/><path d="M9 21 L12.4 14.2 M23 21 L19.6 14.2" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>
    <span style="font-family:"Martian Mono", ui-monospace, Menlo, monospace;font-size:12px;font-weight:600;letter-spacing:.02em;line-height:1;flex: 1;">LELANTOS</span>
    <span style="display: flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line-strong); border-radius: 2px; font-size: 13px;">
      <span class="mark" style="width: 14px; height: 14px; background: #2151f5; font-size: 8px; color: #fff;">B</span>Base
    </span>
    <span class="mark" style="width: 32px; height: 32px; background: var(--bg-2); border: 1px solid var(--line-strong); color: var(--fg-dim); font-size: 11px;">7a</span>
  </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:16px;padding:20px 18px;">

    <div style="display:flex;align-items:center;gap:12px;">
      <span class="mark" style="width:38px;height:38px;border-radius:4px;border:1px solid var(--line-strong);background:var(--bg-1);color:var(--fg-dim);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </span>
      <div style="display:flex;flex-direction:column;gap:0;">
        <span style="font-family:var(--display);font-size:22px;font-weight:600;">Swap</span>
        <span style="font-size:13px;color:var(--accent);">Both sides stay shielded</span>
      </div>
    </div>


    <div style="border:1px solid var(--line-strong);background:var(--bg-1);padding:16px;display:flex;flex-direction:column;gap:8px;">
      <div style="background:var(--bg-2);padding:15px 14px;display:flex;flex-direction:column;gap:10px;">
        <span class="sub">You pay</span>
        <div style="display:flex;align-items:center;gap:11px;">
          <span class="num" style="font-family:var(--display);font-size:31px;font-weight:600;line-height:1;flex:1;">1,000</span>
          <div style="display:flex;align-items:center;gap:6px;padding:7px 11px 7px 7px;border:1px solid var(--line-strong);background:var(--bg-1);flex:none;">
            <span class="mark" style="width:22px;height:22px;background:rgba(122,160,180,0.16);border:1px solid rgba(122,160,180,0.42);color:#8FB6C9;font-size:8px;">USDC</span>
            <span style="font-size:14px;font-weight:600;">USDC</span>
          </div>
        </div>
        <span class="sub">Shielded 8,420.00</span>
      </div>
      <div style="display:flex;justify-content:center;margin:-16px 0;position:relative;z-index:1;">
        <span style="width:34px;height:34px;border:3px solid var(--bg-1);background:var(--bg-3);display:inline-grid;place-items:center;color:var(--fg-dim);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg>
        </span>
      </div>
      <div style="background:var(--bg-2);border:1px solid rgba(224,121,74,0.28);padding:15px 14px;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <span class="sub">You receive</span>
          <span class="num" style="padding:2px 8px;border:1px solid var(--line-strong);font-size:11px;color:var(--fg-mute);">12s ↻</span>
        </div>
        <div style="display:flex;align-items:center;gap:11px;">
          <span class="num" style="font-family:var(--display);font-size:31px;font-weight:600;line-height:1;flex:1;color:var(--accent);">0.3742</span>
          <div style="display:flex;align-items:center;gap:6px;padding:7px 11px 7px 7px;border:1px solid var(--line-strong);background:var(--bg-1);flex:none;">
            <span class="mark" style="width:22px;height:22px;background:rgba(224,169,63,0.13);border:1px solid rgba(224,169,63,0.34);color:#E0A93F;font-size:9px;">ETH</span>
            <span style="font-size:14px;font-weight:600;">ETH</span>
          </div>
        </div>
        <span class="sub">You receive at least 0.3723 ETH</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px;min-height:44px;">
      <span style="display:flex;align-items:center;gap:7px;font-size:15px;color:var(--fg-dim);">Details
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--fg-mute)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </span>
      <span class="num" style="font-size:14px;color:var(--fg-dim);">Slippage 0.50% · fees 1.20 USDC</span>
    </div><div class="cta" style="margin-top:auto;">Review</div>
  </div>
</div>
</x-dc>
</body>
</html>
