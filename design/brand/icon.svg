  <circle cx="256" cy="104" r="64" fill="#E0794A"/>
  <circle cx="104" cy="408" r="64" fill="#E0794A"/>
  <circle cx="408" cy="408" r="64" fill="#E0794A"/>
  <path d="M144 336 L198 227 M368 336 L314 227"
        stroke="#E0794A" stroke-width="42" stroke-linecap="round" fill="none"/>
</svg>
