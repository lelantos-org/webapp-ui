# Hashed assets are cached for a year, but only when served: an error for a
# missing one must not be pinned by browsers or the edge. Everything the build
# hashes is under /assets/, plus workbox's runtime at the root.
map $status $asset_cache_control {
    ~^[23]  "public, max-age=31536000, immutable";
    default "no-store";
}

# Files served under the names they were given (the icons, the manifest): an
# hour, so a replaced one is not pinned for a year.
map $status $named_cache_control {
    ~^[23]  "public, max-age=3600";
    default "no-store";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keeps the nginx version out of error-page bodies; Caddy strips only the
    # `Server` header.
    server_tokens off;

    # The `$uri/` arm of try_files 301s a directory request that is missing its
    # trailing slash. An absolute redirect is built from this listen block
    # (http://host:80) and downgrades the scheme behind Caddy's TLS.
    absolute_redirect off;

    # `vite build` emits a `<file>.gz` next to every compressible artifact
    # (`precompress` plugin). Serving those avoids per-request compression and
    # covers the prover .zkey, whose application/octet-stream type is not in
    # gzip_types. `on`, not `always`: clients that do not send
    # Accept-Encoding: gzip get the original file.
    gzip_static on;

    # Fallback for anything without a precompressed twin.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Sends `Vary: Accept-Encoding`, for gzip_static too. Cloudflare edge-caches
    # these assets (terraform/cache.tf) and needs the header to keep the gzip
    # and identity variants apart.
    gzip_vary on;

    # Backstop: build.sourcemap is "hidden" and the Dockerfile strips maps from
    # the image.
    location ~* \.map$ {
        return 404;
    }

    location ~* ^/assets/.*\.(wasm)$ {
        default_type application/wasm;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $asset_cache_control always;
    }

    location ~* ^/assets/.*\.(zkey)$ {
        default_type application/octet-stream;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $asset_cache_control always;
    }

    location ~* ^/(assets/.*\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)|workbox-[0-9a-f]+\.js)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $asset_cache_control always;
    }

    # Any other static file: the icons from public/. Kept apart from
    # `location /` so a missing script, font or image is a 404, not index.html.
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $named_cache_control always;
    }

    # nginx's mime.types has no entry for the extension, and browsers warn on
    # a manifest served as application/octet-stream.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $named_cache_control always;
    }

    # Served from origin scope without a long cache: browsers byte-compare the
    # service worker to detect updates.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # max-age=0, must-revalidate: the browser revalidates every navigation.
    # s-maxage=600: Cloudflare may hold the document for 10 minutes. A stale
    # document is safe because every asset it names is content-hashed and
    # cached for a year. The deploy play also purges these paths at the edge.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        # Generated per build by the `linkHeaders` plugin: Link: rel=preload for
        # the entry chunk, its vendor chunks and the stylesheet. Cloudflare
        # turns these into 103 Early Hints (early_hints in
        # infra/terraform/zone.tf). Document responses only. Must be declared
        # inside this block; see the add_header rule in security-headers.conf.
        include /etc/nginx/link-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate, s-maxage=600" always;
    }
}
