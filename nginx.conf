server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's version lands in error-page bodies. Caddy's `-Server` strips the
    # header on the way out but does not rewrite the body.
    server_tokens off;

    # The `$uri/` arm of try_files below makes nginx 301 a directory request
    # that is missing its trailing slash. By default that redirect is absolute
    # and built from this listen block — http://host:80 — which downgrades the
    # scheme behind Caddy's TLS. Relative redirects keep the client's own.
    absolute_redirect off;

    # `vite build` emits a `<file>.gz` next to every compressible artifact
    # (see the `precompress` plugin in vite.config.ts). gzip_static serves those
    # instead of compressing per-request — which matters most for the ~49 MB
    # prover .zkey, which nginx would otherwise never compress at all
    # (application/octet-stream is not in gzip_types) and which would be
    # ruinous to gzip on the fly. Plain `on`, not `always`: clients that do not
    # send Accept-Encoding: gzip still get the original file.
    gzip_static on;

    # Fallback for anything without a precompressed twin.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Off by default, so compressed responses ship without
    # `Vary: Accept-Encoding`. app. is Cloudflare-proxied and these assets are
    # edge-cached (terraform/cache.tf), and a shared cache needs the header to
    # keep the gzip and identity variants apart. Covers gzip_static too.
    gzip_vary on;

    # build.sourcemap is "hidden" and the Dockerfile strips maps from the image;
    # this is the backstop in case one ever slips through.
    location ~* \.map$ {
        return 404;
    }

    location ~* \.(wasm)$ {
        default_type application/wasm;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(zkey)$ {
        default_type application/octet-stream;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Service worker must be served from origin scope without long cache —
    # browsers byte-compare to detect updates.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # Two audiences, one header.
    #
    #   max-age=0, must-revalidate  -> the browser revalidates every navigation,
    #                                  so a user never runs a stale document.
    #   s-maxage=600                -> Cloudflare may hold it for 10 minutes.
    #
    # Before s-maxage this said plain `no-cache`, which the edge honoured by
    # bypassing entirely: every cold navigation was a full round-trip to this
    # one VPS for 1.9 KB of HTML, and that round-trip was the whole of TTFB.
    #
    # Serving a slightly stale document is safe because every asset it names is
    # content-hashed and pinned for a year, so the chunks it points at still
    # exist. The deploy play purges these paths at the edge anyway, so 600s is
    # the ceiling on an un-purged deploy rather than the normal case.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        # Generated per build by the `linkHeaders` plugin in vite.config.ts: a
        # Link: rel=preload for the entry chunk, its vendor chunks and the
        # stylesheet. Cloudflare turns these into a 103 Early Hints response
        # (early_hints is on in infra/terraform/zone.tf), which starts those
        # fetches a round-trip before the document arrives.
        #
        # Included here and nowhere else — the hints describe what the document
        # needs, so putting them on asset responses would only add bytes. Note
        # the add_header inheritance rule in security-headers.conf: these apply
        # because they are declared inside this block, not above it.
        include /etc/nginx/link-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate, s-maxage=600" always;
    }
}
