<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Must match --bg in src/styles/tokens.css: the browser paints its chrome
         with this before any CSS loads. The first matching tag wins, so the
         light one comes first and follows the OS, as the CSS does; theme-init.js
         sets both to an explicitly chosen theme's ground. -->
    <meta name="theme-color" content="#F7F4ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110E" />
    <meta name="referrer" content="no-referrer" />
    <!--
      A meta CSP ignores `frame-ancestors`, `sandbox` and `report-uri`; those are set as
      HTTP response headers (see security-headers.conf).

      This is the development policy: the inline Fast Refresh preamble from
      `@vitejs/plugin-react` needs 'unsafe-inline'. The `tightenCsp` plugin rewrites
      `script-src` and `connect-src` for the built app and adds Trusted Types. Its
      rewrites throw if this tag stops matching. A production build emits no inline
      script; adding one requires changing that plugin.

      No 'unsafe-eval': the wasm prover instantiates through WebAssembly, which
      'wasm-unsafe-eval' covers, and the snarkjs fallback does not eval. On a page that
      derives a spending key, 'unsafe-eval' hands any injection a code path.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' http: https: ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; font-src 'self'; form-action 'none'"
    />
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- VitePWA injects the `<link rel="manifest">` at build. -->
    <title>Lelantos Wallet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
