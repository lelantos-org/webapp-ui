<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050507" />
    <meta name="referrer" content="no-referrer" />
    <!--
      CSP via meta is partial: `frame-ancestors`, `sandbox`, `report-uri` are ignored here
      and must be set as HTTP response headers in production (see security-headers.conf).

      This is the *development* policy. The SDK uses `new Function` (jubjub-wasm), which
      needs 'unsafe-eval' everywhere; `@vitejs/plugin-react` injects an inline Fast Refresh
      preamble, which needs 'unsafe-inline' in dev only. `tightenCsp` in vite.config.ts
      rewrites both `script-src` and `connect-src` for the built app — a production build
      emits no inline script, so do not add one without revisiting that plugin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' http: https: ws: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- No hand-written `<link rel="manifest">`: VitePWA injects one at build. -->
    <title>Lelantos Wallet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
